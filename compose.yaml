name: fibe-community

x-api-image: &api-image "ghcr.io/fibegg/fibe-releases@sha256:748aaebc35fe6bc1d92af10e5b48ebcf2c8189122df8d25e4a33f00a3c25a382"

services:
  frontend:
    image: "ghcr.io/fibegg/fibe-releases@sha256:e141ad7ecf5b48afbcc9d2e4d39eee5e00631e3b2b890ba957e7d391bc1a2c4a"
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command: ["cp -a /srv/ui/. /frontend/ && chmod -R a+rX /frontend"]
    volumes:
      - frontend:/frontend

  setup:
    image: *api-image
    command: ["setup", "migrate", "--lock-wait", "300"]
    volumes:
      - data:/data

  api:
    image: *api-image
    command:
      - serve
      - --require-migrated
      - --listen
      - 0.0.0.0:8080
      - --public-origin
      - http://localhost:8080
      - --frontend-dir
      - /frontend
    depends_on:
      setup:
        condition: service_completed_successfully
      frontend:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - data:/data
      - frontend:/frontend:ro

volumes:
  data:
  frontend:
    name: fibe-community-frontend-0.1.0-e2bcfe32
